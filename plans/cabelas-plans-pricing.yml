description: >-
  Cabela's publishes no API and therefore no API plans or pricing. This artifact records
  that honest zero. It REPLACES a scaffold written by the 2026-05-04 bulk sweep which
  invented three tiers (Free / Professional / Enterprise) with fabricated quotas, rate
  limits and TBD prices for an API that does not exist; that scaffold was never harvested
  from Cabela's and asserted a commercial API programme on the company's behalf.
plan_count: 0
plans: []
plans_note: >-
  Zero published API plans. Cabela's is a consumer outdoor-goods retailer with no developer
  programme, no API pricing page and no "contact sales for API access" form — this is not a
  gated enterprise plan, it is the absence of an API product entirely.
adjacent_commercial_programs:
  - name: Cabela's Affiliate Program
    kind: affiliate
    confirmed_by_provider: true
    provider_evidence: https://help.cabelas.com/company-information-ff566349/does-cabelas-offer-an-affiliate-program-f0dc0e62
    signup_url: https://www.cabelas.com/shop/en/affiliate-program
    signup_url_status: 403
    signup_url_note: >-
      URL is named verbatim by Cabela's own help-centre article; the Akamai edge returned
      403 to our probe, so the page could not be read and is recorded as unverified rather
      than dead.
    note: >-
      The nearest thing Cabela's operates to a partner data surface. The help centre
      confirms the programme exists but names no network, no product feed and no API.
      Third-party affiliate directories report it runs on Impact (Impact Radius) with a
      product data feed and deep links; that attribution is THIRD-PARTY REPORTED, was not
      confirmed on any Cabela's surface, and is recorded here as a lead only. Any feed it
      offers is issued by the affiliate network to approved affiliates, not published by
      Cabela's as an API.
  - name: Vendor EDI
    kind: b2b-edi
    confirmed_by_provider: false
    note: >-
      Cabela's transacts with suppliers over EDI, brokered through SPS Commerce, per SPS
      Commerce's own partner directory. No Cabela's-published EDI implementation guide,
      X12 message catalogue or machine-readable contract was found on any Cabela's host,
      so nothing is registered as a contract and no conformance claim is made.
