    browser header set. www.cabelas.com sits behind an Akamai bot-management policy that
    returns HTTP 403 with a "Site Maintenance" interstitial to non-allowlisted clients —
    including to two independent egress paths — but the host is demonstrably LIVE (the same
    client received HTTP 200 with the real robots.txt and 200 KB app-router 404 pages
    inside an earlier window). Per the pipeline contract an ordinary edge bot policy is not
    a dead pointer, so no pointer was removed.
