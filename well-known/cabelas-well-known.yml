  - host: https://help.cabelas.com
    note: >-
      Cabela's public help centre, served from CloudFront and built on the Shelf.io
      knowledge-base platform (the rendered pages carry a shelf.io footer credit). It is
      the one host in this record that publishes a real machine-readable document.
    documents:
      - path: /llms.txt
        status: 200
        content_type: text/markdown; charset=utf-8
        file: ../llms/cabelas-llms.txt
        note: >-
          REAL DOCUMENT. 27,573 bytes of llms.txt-format markdown titled "# Cabela's",
          indexing 9 help sections and roughly 140 FAQ articles, every link on
          help.cabelas.com. This is a support-content index, not an API contract.
      - path: /robots.txt
        status: 200
        note: >-
          Carries a Content Signals declaration — `Content-signal: search=yes,
          ai-input=yes, ai-train=no` — and then names bots individually: Claude-SearchBot,
          Claude-User, OAI-SearchBot, ChatGPT-User, PerplexityBot and Perplexity-User are
          allowed; ClaudeBot, Anthropic-AI, Claude-Web, GPTBot, Google-Extended, CCBot and
          Cohere-ai are disallowed. A deliberate serve-at-inference / refuse-for-training
          posture, consistent with the llms.txt above.
      - path: /.well-known/security.txt
        status: 200
        note: >-
          NOT A DOCUMENT. 200 returning the Next.js SPA shell (105 KB of text/html) — this
          host answers 200 with the same HTML for every unmatched path. Treated as a miss.
