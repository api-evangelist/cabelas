subdomains_absent:
  note: >-
    None of the conventional developer-surface hostnames resolve in DNS at all — not
    NXDOMAIN-behind-a-CDN, simply no record. This is the clearest single signal that
    Cabela's runs no developer program.
  checked:
    - api.cabelas.com
    - developer.cabelas.com
    - dev.cabelas.com
    - apis.cabelas.com
    - status.cabelas.com
    - trust.cabelas.com
    - cabelas.custhelp.com
findings:
  agent_card: >-
    NONE. /.well-known/agent-card.json and the legacy /.well-known/agent.json were probed
    on all five hosts. www.cabelas.com and stores.cabelas.com returned genuine 404s;
    help.cabelas.com returned the SPA catch-all HTML shell, which is not a card; the apex
    and Canadian hosts were behind an Akamai 403. Nothing was written to a2a/.
  well_known_pointer: >-
    NOT EMITTED. No probed path returned a 200 carrying a real /.well-known/ document on
    any host, so no WellKnown and no SecurityTxt pointer is wired into apis.yml. The one
    real machine-readable document found, help.cabelas.com/llms.txt, is not a
    /.well-known/ resource and is pointed at with type LLMsTxt instead.
