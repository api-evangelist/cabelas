agent_differential_note: >-
  Worth flagging for the agent-commercialization layer: www.cabelas.com/robots.txt
  explicitly ALLOWS OAI-SearchBot, PerplexityBot, ChatGPT-User, YouBot, PhindBot, ExaBot,
  xai-bot and FirecrawlAgent, yet the Akamai edge in front of it answers 403 to any client
  not on its own allowlist. The stated policy and the deployed behaviour do not agree. The
  help centre is the opposite and coherent: its robots.txt carries an explicit
  Content-signal declaration (search=yes, ai-input=yes, ai-train=no), allows the
  inference-time bots by name, disallows the training crawlers, and backs that up by
  actually serving a 27 KB llms.txt to anonymous clients.
