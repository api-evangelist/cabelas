method: probed
source: >-
  Live probes of the named /.well-known/ path list plus /llms.txt, /robots.txt and the
  REST spec roots on every host this record knows: www.cabelas.com, cabelas.com,
  help.cabelas.com, stores.cabelas.com and www.cabelas.ca. No apis[].baseURL and no
  OpenAPI servers[] host exists for this provider, so the registrable domain, the help
  centre, the Yext-hosted store locator and the Canadian storefront are the full host set.
hosts:
  - host: https://www.cabelas.com
    note: >-
      Akamai edge. Answers real content only to a full browser header set and rate-limits
      hard after a handful of requests; every status below was read inside a window in
      which the same client got HTTP 200 with the real robots.txt, so these are genuine
      application 404s from the Next.js app router, not a challenge page.
    documents:
      - path: /robots.txt
        status: 200
        note: >-
          Real robots.txt. Allows OAI-SearchBot, PerplexityBot, ChatGPT-User, YouBot,
          PhindBot, ExaBot, xai-bot and FirecrawlAgent (crawl-delay 10) while disallowing
          GPTBot and CCBot. Names one sitemap, the legacy WebSphere Commerce
          sitemap_10651.xml.gz. No API or developer path is referenced.
      - path: /.well-known/security.txt
        status: 404
      - path: /.well-known/openid-configuration
        status: 404
      - path: /.well-known/oauth-authorization-server
        status: 404
