limits_note: >-
  Zero published rate limits. No rate-limit response headers can be recorded either,
  because there is no API endpoint to observe them on — the only rate-limiting behaviour
  Cabela's exhibits is an Akamai bot-management policy on the www storefront, which returns
  HTTP 403 with a "Site Maintenance" interstitial to non-allowlisted clients. That is edge
  bot defence on a retail website, not an API rate-limit contract, and is deliberately not
  recorded as one.
