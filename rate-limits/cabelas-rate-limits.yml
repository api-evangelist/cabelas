description: >-
  Cabela's publishes no API and therefore no rate limits. This artifact records that
  honest zero. It REPLACES a scaffold written by the 2026-05-04 bulk sweep which invented
  free/professional/enterprise quotas (10/100/1000 requests per minute), an
  X-RateLimit-* header family and backoff, burst and fair-use policies for an API that does
  not exist; none of it was ever harvested from Cabela's.
